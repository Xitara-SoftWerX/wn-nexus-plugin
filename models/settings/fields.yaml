tabs:
    fields:
        # main_menu:
        #     label: xitara.nexus::settings.main_menu
        #     tab: xitara.nexus::settings.tab.menu
        #     type: section
        #     comment: xitara.nexus::settings.main_menu_comment
        menu_text:
            label: xitara.nexus::settings.menu_text
            tab: xitara.nexus::settings.tab.menu
            type: text
            span: left
            comment: xitara.nexus::settings.menu_text_comment
        is_compact_display:
            label: xitara.nexus::settings.is_compact_display
            tab: xitara.nexus::settings.tab.menu
            type: switch
            span: storm
            cssClass: col-md-3
            comment: xitara.nexus::settings.is_compact_display_comment
        menu_icon_uploaded:
            label: xitara.nexus::settings.menu_icon
            tab: xitara.nexus::settings.tab.menu
            type: fileupload
            fileTypes: png,bmp,jpg,gif,svg
            # imageWidth: 200
            # imageHeight: 200
            mode: image
            span: left
            comment: xitara.nexus::settings.menu_icon_comment
        menu_icon_text:
            label: xitara.nexus::settings.menu_icon_text
            tab: xitara.nexus::settings.tab.menu
            type: text
            span: right
            comment: xitara.nexus::settings.menu_icon_text_comment
            commentHtml: true
        dashboard_text:
            label: xitara.nexus::settings.dashboard_text
            tab: xitara.nexus::settings.tab.dashboard
            type: richeditor
            span: full
            size: giant
            comment: xitara.nexus::settings.dashboard_text_comment
            commentHtml: true

        extended_exception_view_enabled:
            label: xitara.nexus::settings.exception.enabled
            comment: xitara.nexus::settings.exception.enabled_comment
            tab: xitara.nexus::settings.tab.exception
            type: switch
            span: left
        exception_view_compatibility:
            label: xitara.nexus::settings.exception.compatibility
            tab: xitara.nexus::settings.tab.exception
            type: partial
            path: $/xitara/nexus/models/settings/_exception_compatibility.php
            span: full

        default_email:
            label: xitara.nexus::settings.default_email
            comment: xitara.nexus::settings.default_email_comment
            tab: xitara.nexus::settings.tab.default
            type: text
            span: left
        default_email_name:
            label: xitara.nexus::settings.default_email_name
            comment: xitara.nexus::settings.default_email_name_comment
            tab: xitara.nexus::settings.tab.default
            type: text
            span: right
